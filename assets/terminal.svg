<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Terminal: whoami">
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <clipPath id="c1"><rect x="0" y="0" height="400" width="0"><animate attributeName="width" from="0" to="1200" begin="0.4s" dur="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="0" y="0" height="400" width="0"><animate attributeName="width" from="0" to="1200" begin="4.6s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="0" y="0" height="400" width="0"><animate attributeName="width" from="0" to="1200" begin="6.3s" dur="0.9s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:17px;white-space:pre}
    .p{fill:#22d3ee}.u{fill:#a78bfa}.w{fill:#e6edf3}.m{fill:#7d8ea8}.g{fill:#4ade80}.y{fill:#fbbf24}.k{fill:#f472b6}
    .ln{opacity:0;animation:in .35s ease-out forwards}
    @keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
    .cur{animation:bl 1s steps(1) infinite}
    @keyframes bl{50%{opacity:0}}
  </style>
  <rect width="1200" height="400" rx="16" fill="url(#tb)"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="16" fill="none" stroke="#1f2d45"/>
  <rect width="1200" height="44" rx="16" fill="#0f1a2c"/><rect y="28" width="1200" height="16" fill="#0f1a2c"/>
  <circle cx="30" cy="22" r="7" fill="#ff5f57"/><circle cx="54" cy="22" r="7" fill="#febc2e"/><circle cx="78" cy="22" r="7" fill="#28c840"/>
  <text x="600" y="28" text-anchor="middle" class="m" style="font-size:14px">jaffar@ai-lab: ~/profile — zsh</text>

  <g clip-path="url(#c1)"><text x="36" y="88"><tspan class="p">jaffar@ai-lab</tspan><tspan class="m">:</tspan><tspan class="u">~</tspan><tspan class="m">$ </tspan><tspan class="w">whoami --verbose</tspan></text></g>

  <text x="36" y="124" class="ln" style="animation-delay:1.7s"><tspan class="g">▸ role      </tspan><tspan class="w">Senior AI Engineer · Automation Architect · Data Engineer</tspan></text>
  <text x="36" y="154" class="ln" style="animation-delay:2.1s"><tspan class="g">▸ shipped   </tspan><tspan class="w">Dynatrace · Wellbands · Climbo · Humanic · Kadoa · Trupeer · +3</tspan></text>
  <text x="36" y="184" class="ln" style="animation-delay:2.5s"><tspan class="g">▸ scale     </tspan><tspan class="y">350M+</tspan><tspan class="w"> records · </tspan><tspan class="y">$1.36M+</tspan><tspan class="w"> revenue tracked · </tspan><tspan class="y">6</tspan><tspan class="w">-agent CEO OS</tspan></text>
  <text x="36" y="214" class="ln" style="animation-delay:2.9s"><tspan class="g">▸ research  </tspan><tspan class="w">IEEE Access — First Author · NLP sentiment × crypto forecasting</tspan></text>
  <text x="36" y="244" class="ln" style="animation-delay:3.3s"><tspan class="g">▸ stack     </tspan><tspan class="w">Python · Django · OpenAI · Qdrant · n8n · BigQuery · AWS/GCP</tspan></text>

  <g clip-path="url(#c2)"><text x="36" y="290"><tspan class="p">jaffar@ai-lab</tspan><tspan class="m">:</tspan><tspan class="u">~</tspan><tspan class="m">$ </tspan><tspan class="w">cat principles.md</tspan></text></g>
  <text x="36" y="324" class="ln" style="animation-delay:5.7s"><tspan class="k">"</tspan><tspan class="w">If a human does it twice, an agent should do it the third time.</tspan><tspan class="k">"</tspan></text>

  <g clip-path="url(#c3)"><text x="36" y="366"><tspan class="p">jaffar@ai-lab</tspan><tspan class="m">:</tspan><tspan class="u">~</tspan><tspan class="m">$ </tspan><tspan class="w">./ship --production</tspan></text></g>
  <rect class="cur" x="408" y="352" width="10" height="19" fill="#22d3ee" opacity="0"><set attributeName="opacity" to="1" begin="7.3s"/></rect>
</svg>
