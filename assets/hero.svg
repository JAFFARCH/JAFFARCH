<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Jaffar Ali — Senior AI Engineer and Automation Architect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.55" stop-color="#0a1224"/>
      <stop offset="1" stop-color="#071a2b"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.12" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#9be7ff"/>
      <stop offset="0.65" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2a44" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="6s" repeatCount="indefinite"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.9"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="440" fill="url(#gridFade)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="card"><rect width="1200" height="440" rx="22"/></clipPath>
  </defs>

  <style>
    .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .fade{}
    .d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}.d4{animation-delay:1.05s}.d5{animation-delay:1.35s}.d6{animation-delay:1.65s}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .node{animation:pulse 3s ease-in-out infinite}
    .n2{animation-delay:.4s}.n3{animation-delay:.8s}.n4{animation-delay:1.2s}.n5{animation-delay:1.6s}.n6{animation-delay:2s}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    .dot{animation:blink 1.4s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
    .ring{transform-origin:930px 220px;animation:spin 24s linear infinite}
    .ring2{transform-origin:930px 220px;animation:spin 16s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .scan{animation:scan 5s linear infinite}
    @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(480px)}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect width="1200" height="440" fill="url(#glowA)"/>
    <rect width="1200" height="440" fill="url(#glowB)"/>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="url(#edge)" opacity="0.5"/>

    <!-- ============ neural core (right) ============ -->
    <g opacity="0.95">
      <circle class="ring" cx="930" cy="220" r="150" fill="none" stroke="#1e3a5f" stroke-width="1.2" stroke-dasharray="4 10"/>
      <circle class="ring2" cx="930" cy="220" r="118" fill="none" stroke="#2c4f7c" stroke-width="1" stroke-dasharray="60 18 6 18"/>
      <circle cx="930" cy="220" r="185" fill="none" stroke="#12233d" stroke-width="1"/>

      <!-- edges -->
      <g stroke="#2b4a73" stroke-width="1" fill="none" opacity="0.8">
        <path id="e1" d="M760 120 L870 170"/><path id="e2" d="M760 220 L870 170"/><path id="e3" d="M760 220 L870 270"/>
        <path id="e4" d="M760 320 L870 270"/><path id="e5" d="M760 120 L870 270"/><path id="e6" d="M760 320 L870 170"/>
        <path id="e7" d="M870 170 L990 220"/><path id="e8" d="M870 270 L990 220"/><path id="e9" d="M870 170 L990 120"/>
        <path id="e10" d="M870 270 L990 320"/><path id="e11" d="M990 220 L1100 220"/><path id="e12" d="M990 120 L1100 220"/><path id="e13" d="M990 320 L1100 220"/>
      </g>
      <!-- signal particles -->
      <g fill="#7df9ff">
        <circle r="2.6"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
        <circle r="2.6"><animateMotion dur="2.6s" begin=".6s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
        <circle r="2.6"><animateMotion dur="2.4s" begin="1.1s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>
        <circle r="2.6"><animateMotion dur="3s" begin=".3s" repeatCount="indefinite"><mpath href="#e6"/></animateMotion></circle>
        <circle r="2.6" fill="#c4b5fd"><animateMotion dur="1.8s" begin=".2s" repeatCount="indefinite"><mpath href="#e7"/></animateMotion></circle>
        <circle r="2.6" fill="#c4b5fd"><animateMotion dur="2s" begin="1s" repeatCount="indefinite"><mpath href="#e8"/></animateMotion></circle>
        <circle r="2.6" fill="#c4b5fd"><animateMotion dur="2.3s" begin=".5s" repeatCount="indefinite"><mpath href="#e10"/></animateMotion></circle>
        <circle r="3" fill="#ffffff"><animateMotion dur="1.6s" begin=".8s" repeatCount="indefinite"><mpath href="#e11"/></animateMotion></circle>
        <circle r="2.6" fill="#7df9ff"><animateMotion dur="2.1s" begin="1.4s" repeatCount="indefinite"><mpath href="#e12"/></animateMotion></circle>
        <circle r="2.6" fill="#7df9ff"><animateMotion dur="2.5s" begin=".1s" repeatCount="indefinite"><mpath href="#e13"/></animateMotion></circle>
      </g>
      <!-- nodes -->
      <g>
        <circle class="node" cx="760" cy="120" r="7" fill="#0b1a2e" stroke="#38bdf8" stroke-width="2"/>
        <circle class="node n2" cx="760" cy="220" r="7" fill="#0b1a2e" stroke="#38bdf8" stroke-width="2"/>
        <circle class="node n3" cx="760" cy="320" r="7" fill="#0b1a2e" stroke="#38bdf8" stroke-width="2"/>
        <circle class="node n4" cx="870" cy="170" r="9" fill="#0b1a2e" stroke="#60a5fa" stroke-width="2"/>
        <circle class="node n5" cx="870" cy="270" r="9" fill="#0b1a2e" stroke="#60a5fa" stroke-width="2"/>
        <circle class="node n6" cx="990" cy="120" r="8" fill="#0b1a2e" stroke="#a78bfa" stroke-width="2"/>
        <circle class="node n2" cx="990" cy="220" r="11" fill="#0b1a2e" stroke="#a78bfa" stroke-width="2"/>
        <circle class="node n4" cx="990" cy="320" r="8" fill="#0b1a2e" stroke="#a78bfa" stroke-width="2"/>
        <circle cx="1100" cy="220" r="16" fill="#00d4ff" opacity="0.25" filter="url(#blur)"><animate attributeName="r" values="14;22;14" dur="2.4s" repeatCount="indefinite"/></circle>
        <circle cx="1100" cy="220" r="10" fill="#e0fbff"/>
      </g>
      <g class="mono" font-size="11" fill="#5b7aa6">
        <text x="728" y="100">input</text><text x="848" y="146">embed</text><text x="962" y="98">reason</text><text x="1072" y="196">act</text>
      </g>
    </g>

    <!-- ============ identity (left) ============ -->
    <g class="fade d1">
      <rect x="64" y="70" width="284" height="28" rx="14" fill="#0e2238" stroke="#1f4b73"/>
      <circle class="dot" cx="84" cy="84" r="5" fill="#22c55e"/>
      <text class="mono" x="98" y="89" font-size="13" fill="#9fdcff">available · senior engagements</text>
    </g>
    <text class="mono fade d2" x="64" y="140" font-size="15" fill="#38bdf8" letter-spacing="3">// SENIOR AI ENGINEER · AUTOMATION ARCHITECT</text>
    <text class="sans fade d3" x="60" y="222" font-size="84" font-weight="800" fill="url(#nameGrad)" letter-spacing="-2">Jaffar Ali</text>
    <text class="sans fade d4" x="64" y="268" font-size="21" fill="#c9d6ea">I design LLM agents, automation platforms and data</text>
    <text class="sans fade d4" x="64" y="296" font-size="21" fill="#c9d6ea">infrastructure that run real businesses — in production.</text>

    <g class="fade d5 mono" font-size="13">
      <rect x="64" y="328" width="112" height="30" rx="8" fill="#0d1b2e" stroke="#23466e"/><text x="120" y="348" text-anchor="middle" fill="#8fd3ff">LLM Agents</text>
      <rect x="184" y="328" width="92" height="30" rx="8" fill="#0d1b2e" stroke="#23466e"/><text x="230" y="348" text-anchor="middle" fill="#8fd3ff">RAG</text>
      <rect x="284" y="328" width="150" height="30" rx="8" fill="#0d1b2e" stroke="#23466e"/><text x="359" y="348" text-anchor="middle" fill="#8fd3ff">n8n Orchestration</text>
      <rect x="442" y="328" width="148" height="30" rx="8" fill="#0d1b2e" stroke="#23466e"/><text x="516" y="348" text-anchor="middle" fill="#8fd3ff">Data Engineering</text>
      <rect x="598" y="328" width="100" height="30" rx="8" fill="#0d1b2e" stroke="#23466e"/><text x="648" y="348" text-anchor="middle" fill="#8fd3ff">Voice AI</text>
    </g>
    <g class="fade d6 mono" font-size="12" fill="#5f7797">
      <text x="64" y="396">IEEE Access · First Author   |   350M+ records engineered   |   9+ production platforms</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="439" rx="22" fill="none" stroke="#1d3656"/>
    <rect x="0" y="437" width="1200" height="3" fill="url(#edge)">
      <animate attributeName="x" values="-1200;1200" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
