<circle r="3" fill="#7df9ff"><animateMotion dur="3.20s" begin="1.40s" repeatCount="indefinite"><mpath href="#s4"/></animateMotion></circle>
<circle r="3" fill="#c4b5fd"><animateMotion dur="2.00s" begin="0.20s" repeatCount="indefinite"><mpath href="#a0"/></animateMotion></circle>
<circle r="3" fill="#c4b5fd"><animateMotion dur="2.20s" begin="0.50s" repeatCount="indefinite"><mpath href="#a1"/></animateMotion></circle>
<circle r="3" fill="#c4b5fd"><animateMotion dur="2.40s" begin="0.80s" repeatCount="indefinite"><mpath href="#a2"/></animateMotion></circle>
<circle r="3" fill="#c4b5fd"><animateMotion dur="2.60s" begin="1.10s" repeatCount="indefinite"><mpath href="#a3"/></animateMotion></circle>
<circle r="3" fill="#c4b5fd"><animateMotion dur="2.80s" begin="1.40s" repeatCount="indefinite"><mpath href="#a4"/></animateMotion></circle>
<circle r="3" fill="#c4b5fd"><animateMotion dur="3.00s" begin="1.70s" repeatCount="indefinite"><mpath href="#a5"/></animateMotion></circle>
<circle r="3" fill="#fbbf24"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#dn"/></animateMotion></circle>
<circle r="3" fill="#4ade80"><animateMotion dur="1.6s" begin=".8s" repeatCount="indefinite"><mpath href="#up"/></animateMotion></circle>
<circle cx="600" cy="270" r="150" fill="url(#core)"/>
<circle class="ring" cx="600" cy="270" r="118" fill="none" stroke="#1e4a73" stroke-dasharray="3 9"/>
<circle class="ring2" cx="600" cy="270" r="104" fill="none" stroke="#3b2f7a" stroke-dasharray="40 14 4 14"/>
<g class="in" style="animation-delay:.3s">
<rect x="470" y="188" width="260" height="164" rx="16" fill="url(#orch)" stroke="#2f6a9e" stroke-width="1.5"/>
<text class="mono cap" x="600" y="216" text-anchor="middle">ORCHESTRATION CORE</text>
<text class="sans" x="600" y="248" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">n8n + LLM Router</text>
<g class="mono" font-size="11.5" fill="#b8c7de" text-anchor="middle">
<text x="600" y="276">intent classification · tool calling</text>
<text x="600" y="296">conversation memory · guardrails</text>
<text x="600" y="316">retries · observability · feedback</text>
</g>
