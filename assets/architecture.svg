<path id="a4" class="fl" d="M730 270 C 840 270, 840 370, 950 370"/>
<g class="in" style="animation-delay:0.98s"><rect class="box" x="950" y="348" width="210" height="44" rx="10"/><circle class="live" style="animation-delay:1.00s" cx="1142" cy="370" r="3.5" fill="#22c55e"/><text class="sans h" x="968" y="367" font-size="13">Finance Agent</text><text class="mono sub" x="968" y="383">invoices · anomalies</text></g>
<path id="a5" class="fl" d="M730 270 C 840 270, 840 426, 950 426"/>
<g class="in" style="animation-delay:1.10s"><rect class="box" x="950" y="404" width="210" height="44" rx="10"/><circle class="live" style="animation-delay:1.25s" cx="1142" cy="426" r="3.5" fill="#22c55e"/><text class="sans h" x="968" y="423" font-size="13">Admin Agent</text><text class="mono sub" x="968" y="439">calendar · meeting prep</text></g>
<path id="dn" class="fl dash" d="M570 352 L570 440"/><path id="up" class="fl dash" d="M630 440 L630 352"/>
<text class="mono sub" x="580" y="400">write</text><text class="mono sub" x="640" y="400">retrieve</text>
<circle r="3" fill="#7df9ff"><animateMotion dur="2.20s" begin="0.00s" repeatCount="indefinite"><mpath href="#s0"/></animateMotion></circle>
<circle r="3" fill="#7df9ff"><animateMotion dur="2.45s" begin="0.35s" repeatCount="indefinite"><mpath href="#s1"/></animateMotion></circle>
<circle r="3" fill="#7df9ff"><animateMotion dur="2.70s" begin="0.70s" repeatCount="indefinite"><mpath href="#s2"/></animateMotion></circle>
