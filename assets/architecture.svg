<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Agent orchestration architecture">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a14"/><stop offset="1" stop-color="#0a1426"/></linearGradient>
<radialGradient id="core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<linearGradient id="orch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2944"/><stop offset="1" stop-color="#1b1640"/></linearGradient>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".15"/><stop offset=".5" stop-color="#38bdf8" stop-opacity=".55"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".15"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#15233a"/></pattern>
</defs>
<style>
.mono{font-family:'JetBrains Mono',Consolas,Menlo,monospace}
.sans{font-family:'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
.box{fill:#0c1628;stroke:#1f3a5c}
.h{font-size:14px;font-weight:700;fill:#e6edf3}
.sub{font-size:11px;fill:#7d93b3}
.cap{font-size:11px;letter-spacing:2.5px;fill:#38bdf8}
.fl{fill:none;stroke:url(#ln);stroke-width:1.4}
.dash{stroke-dasharray:6 8;animation:d 1.2s linear infinite}
@keyframes d{to{stroke-dashoffset:-28}}
.ring{transform-origin:600px 270px;animation:r 20s linear infinite}
.ring2{transform-origin:600px 270px;animation:r 12s linear infinite reverse}
@keyframes r{to{transform:rotate(360deg)}}
.in{}
@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.live{animation:b 1.5s ease-in-out infinite}
@keyframes b{50%{opacity:.2}}
</style>
<rect width="1200" height="560" rx="18" fill="url(#bg)"/>
<rect width="1200" height="560" rx="18" fill="url(#dots)"/>
<rect x=".5" y=".5" width="1199" height="559" rx="18" fill="none" stroke="#1d3656"/>
<text class="mono cap" x="40" y="44">SYSTEM ARCHITECTURE</text>
<text class="sans" x="40" y="72" font-size="22" font-weight="800" fill="#f1f5f9">Agent Orchestration Platform</text>
<text class="mono sub" x="1160" y="44" text-anchor="end">event-driven · LLM-routed · feedback-learning</text>
<circle class="live" cx="1080" cy="67" r="4" fill="#22c55e"/><text class="mono sub" x="1160" y="71" text-anchor="end">production</text>
<text class="mono cap" x="40" y="112" fill="#5b7aa6">SOURCES</text>
<text class="mono cap" x="1160" y="112" text-anchor="end">AUTONOMOUS AGENTS</text>

<path id="s0" class="fl" d="M250 155 C 360 155, 360 270, 470 270"/>
